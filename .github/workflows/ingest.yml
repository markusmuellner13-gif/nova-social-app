# ─────────────────────────────────────────────────────────────────────────────
# Autonomous event ingestion — runs in GitHub's cloud, every 30 minutes, with
# NO laptop and NO Vercel Pro plan required.
#
# Why this exists: the Vercel Hobby plan only allows ONE cron run per day. To
# keep the database genuinely fresh ("fetch every now and then"), this scheduled
# GitHub Action pings the app's own ingestion endpoint on a 30-minute cadence and
# chains several slices per run, so the whole 78-city × 18-category catalogue is
# refreshed continuously — entirely for free (GitHub Actions minutes are free for
# public repos).
#
# SETUP (one-time): in the GitHub repo → Settings → Secrets and variables →
# Actions, add a repository secret named CRON_SECRET whose value matches the
# CRON_SECRET env var set in Vercel. (Optional) add a variable NOVA_BASE_URL to
# override the production URL below.
#
# WHY EVERY CALL CHECKS ITS HTTP STATUS — on 2026-08-06 this workflow reported
# SUCCESS for fifteen hours while ingesting exactly nothing. `curl -s` exits 0 on
# a 401, so the body `{"ok":false,"error":"unauthorized"}` was grepped for
# "ingested":N, found nothing, defaulted to 0, saw no nextOffset, and cheerfully
# announced "fast tier fully refreshed" in nine seconds. The one signal that
# something was wrong — the run duration dropping from ~13 minutes to 9 seconds —
# is not something GitHub alerts on. A job that cannot fail cannot be monitored,
# so a non-2xx now ends the run red.
# ─────────────────────────────────────────────────────────────────────────────
name: Ingest events (autonomous)

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # ...and a manual "Run workflow" button

# Never run two ingests at once.
concurrency:
  group: nova-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Worst case: 8 fast-tier calls + 10 main calls + 1 towns call, each up to
    # ~90s (curl -m 90) = ~19 min. 15 min was too tight and got the job killed
    # by GitHub's own timeout mid-run (conclusion: cancelled) whenever slices
    # ran slow — that's what triggered the failure email. Give it real headroom
    # while still finishing before the next run fires 30 min later.
    timeout-minutes: 25
    steps:
      - name: Refresh time-sensitive content (fast tier — every run)
        env:
          BASE_URL: ${{ vars.NOVA_BASE_URL || 'https://nova-phi-liart.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          auth="Authorization: Bearer $CRON_SECRET"
          # The fast tier (events/music/sports/art/venues/community) changes
          # constantly, so we sweep it in FULL every 30 minutes. It's a small
          # list, so a few slices cover the whole catalogue. Slow-moving places
          # (museums, restaurants, hotels, trails…) ride the daily full sweep below.
          offset=0
          ok_slices=0
          for i in $(seq 1 8); do
            code=$(curl -s -m 90 -H "$auth" -o body.json -w '%{http_code}' \
              "$BASE_URL/api/cron/ingest?tier=fast&offset=$offset" || true)
            # 401/403 is a configuration fault — the secret here and the one in
            # Vercel have drifted. Retrying can never fix it, so stop loudly.
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::HTTP $code from /api/cron/ingest — the CRON_SECRET repo secret no longer matches the CRON_SECRET env var in Vercel. Reset both to the same value."
              exit 1
            fi
            if [ "$code" != "200" ]; then
              echo "::warning::fast slice $i: HTTP $code — $(head -c 200 body.json 2>/dev/null)"
              break
            fi
            resp=$(cat body.json)
            ing=$(echo "$resp" | grep -oE '"ingested":[0-9]+' | grep -oE '[0-9]+' || echo 0)
            nxt=$(echo "$resp" | grep -oE '"nextOffset":[0-9]+' | grep -oE '[0-9]+' || echo "")
            ok_slices=$((ok_slices + 1))
            echo "fast slice $i: ingested=${ing:-0} nextOffset=${nxt:-done}"
            if [ -z "$nxt" ]; then echo "fast tier fully refreshed"; break; fi
            offset="$nxt"
          done
          # Zero good slices means the tier did not refresh at all. Green here
          # would be a lie, and a lie nobody would notice.
          if [ "$ok_slices" -eq 0 ]; then
            echo "::error::no fast-tier slice succeeded — the fast tier did not refresh."
            exit 1
          fi

      - name: Drive ingestion across several catalogue slices
        env:
          BASE_URL: ${{ vars.NOVA_BASE_URL || 'https://nova-phi-liart.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          auth="Authorization: Bearer $CRON_SECRET"
          offset=""
          total_ingested=0
          total_rejected=0
          ok_slices=0
          # Each call processes a ~35s slice and returns nextOffset; chain up to
          # 10 calls (~6-7 min) so a big chunk of the catalogue refreshes per run.
          for i in $(seq 1 10); do
            url="$BASE_URL/api/cron/ingest"
            if [ -n "$offset" ]; then url="$url?offset=$offset"; fi
            code=$(curl -s -m 90 -H "$auth" -o body.json -w '%{http_code}' "$url" || true)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::HTTP $code from /api/cron/ingest — the CRON_SECRET repo secret no longer matches the CRON_SECRET env var in Vercel. Reset both to the same value."
              exit 1
            fi
            if [ "$code" != "200" ]; then
              echo "::warning::slice $i: HTTP $code — $(head -c 200 body.json 2>/dev/null)"
              break
            fi
            resp=$(cat body.json)
            ing=$(echo "$resp" | grep -oE '"ingested":[0-9]+' | grep -oE '[0-9]+' || echo 0)
            rej=$(echo "$resp" | grep -oE '"rejected":[0-9]+' | grep -oE '[0-9]+' || echo 0)
            nxt=$(echo "$resp" | grep -oE '"nextOffset":[0-9]+' | grep -oE '[0-9]+' || echo "")
            total_ingested=$((total_ingested + ${ing:-0}))
            total_rejected=$((total_rejected + ${rej:-0}))
            ok_slices=$((ok_slices + 1))
            echo "slice $i: ingested=${ing:-0} rejected=${rej:-0} nextOffset=${nxt:-done}"
            if [ -z "$nxt" ]; then echo "catalogue fully swept — restarting next run"; break; fi
            offset="$nxt"
          done
          echo "── total this run: ingested=$total_ingested rejected=$total_rejected ──"
          if [ "$ok_slices" -eq 0 ]; then
            echo "::error::no catalogue slice succeeded — nothing was swept this run."
            exit 1
          fi

      - name: Refresh small-town events (best-effort, never fails the run)
        env:
          BASE_URL: ${{ vars.NOVA_BASE_URL || 'https://nova-phi-liart.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        continue-on-error: true
        run: |
          # Best-effort by design (it depends on Anthropic credit), but the status
          # is still printed — a silent 401 here is what hid the outage of
          # 2026-08-06, and this step calls the same secret as the two above.
          code=$(curl -s -m 90 -H "Authorization: Bearer $CRON_SECRET" \
            -o body.json -w '%{http_code}' "$BASE_URL/api/cron/ingest-towns?offset=0" || true)
          echo "ingest-towns: HTTP $code"
          head -c 400 body.json 2>/dev/null || true
          echo ""
          if [ "$code" != "200" ]; then
            echo "::warning::ingest-towns returned HTTP $code (step is best-effort, run not failed)."
          fi
