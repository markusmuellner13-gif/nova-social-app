name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: the repo has a pre-existing lint backlog. Surfaces
      # issues without failing the gate. Flip to blocking once the backlog is cleared.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build must succeed with NO secrets — every external integration is
          # gated and no-ops when its key is absent.
          NEXT_TELEMETRY_DISABLED: "1"
