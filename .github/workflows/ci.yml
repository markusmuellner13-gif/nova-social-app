name: CI

# The "CI gate": every push and pull request to master runs the same checks the
# app must pass to be considered healthy — type-check, unit tests and a real
# production build (plus lint, surfaced but non-blocking for now). Vercel still
# deploys on push; this gate is what tells you, within a couple of minutes,
# whether master is actually green. To make it a HARD merge gate, mark the
# "verify" check as required in GitHub → Settings → Branches → branch protection.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer commit on the same ref cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job display name is "verify" so the status-check context matches the branch
  # ruleset's required check named "verify" (Settings → Rules). Renaming this
  # would silently un-gate master, so keep them in sync.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: the lint backlog of real errors is cleared. Genuinely broken
      # code (unescaped JSX, raw <a> page links, unused vars, etc.) now fails the
      # gate. Advisory React-Compiler diagnostics remain warnings (see
      # eslint.config.mjs) so they don't block, but stay visible.
      - name: Lint
        run: npm run lint

      # Blocking: the whole codebase must type-check. Catches the class of bug a
      # build alone can miss and is the real safety net for refactors.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        # Build must succeed with NO secrets — every external integration is
        # gated and no-ops when its key is absent.
