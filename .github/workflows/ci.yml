name: CI

# The "CI gate": every push and pull request to master runs the same checks the
# app must pass to be considered healthy — type-check, unit tests and a real
# production build (plus lint, surfaced but non-blocking for now). Vercel still
# deploys on push; this gate is what tells you, within a couple of minutes,
# whether master is actually green. To make it a HARD merge gate, mark the
# "verify" check as required in GitHub → Settings → Branches → branch protection.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer commit on the same ref cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: the repo has a pre-existing lint backlog. Surfaces
      # issues without failing the gate. Flip to blocking once the backlog is cleared.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      # Blocking: the whole codebase must type-check. Catches the class of bug a
      # build alone can miss and is the real safety net for refactors.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        # Build must succeed with NO secrets — every external integration is
        # gated and no-ops when its key is absent.
